[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
bunnyhop-core = { path = "crates/core" }
bunnyhop-acl = { path = "crates/acl" }
bunnyhop-config = { path = "crates/config" }
bunnyhop-net = { path = "crates/net" }
bunnyhop-proto = { path = "crates/proto" }

anyhow = "1.0.100"
arc-swap = "1.7"
async-trait = "0.1.89"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
bytes = "1.12"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.31", features = ["sink"] }
genetlink = "0.3.0"
getrandom = "0.4.3"
governor = "0.10"
hmac = "0.13"
hyper = "1.11.1"
hyper-util = { version = "0.1.21", features = ["tokio"] }
hickory-server = "0.26.3"
ipnet = { version = "2.12", features = ["serde"] }
jiff = { version = "0.2.37", features = ["serde"] }
netlink-packet-core = "0.9.0"
netlink-packet-generic = "0.5.0"
netlink-packet-wireguard = "0.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rtc-ice = { version = "0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }
rtc-shared = { version = "0.21.1", default-features = false }
rtc-stun = { version = "0.21.1", default-features = false }
rtnetlink = "0.23.0"
sansio = "1.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }
zeroize = { version = "1.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction = { level = "warn", priority = -1 }

absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
as_conversions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
clone_on_ref_ptr = "allow"
cognitive_complexity = "allow"
default_numeric_fallback = "allow"
definition_in_module_root = "allow"
doc_markdown = "allow"
doc_paragraphs_missing_punctuation = "allow"
else_if_without_else = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
float_arithmetic = "allow"
format_push_string = "allow"
impl_trait_in_params = "allow"
implicit_return = "allow"
indexing_slicing = "allow"
integer_division = "allow"
iter_over_hash_type = "allow"
integer_division_remainder_used = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
map_err_ignore = "allow"
min_ident_chars = "allow"
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_inline_in_public_items = "allow"
missing_panics_doc = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
multiple_inherent_impl = "allow"
multiple_unsafe_ops_per_block = "allow"
must_use_candidate = "allow"
needless_borrowed_reference = "allow"
needless_raw_strings = "allow"
needless_pass_by_value = "allow"
non_ascii_literal = "allow"
partial_pub_fields = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
result_large_err = "allow"
question_mark_used = "allow"
ref_patterns = "allow"
rest_pattern_accessible_field = "allow"
semicolon_outside_block = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
significant_drop_tightening = "allow"
single_call_fn = "allow"
single_char_lifetime_names = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
str_to_string = "allow"
string_slice = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "allow"
unimplemented = "allow"
unreachable = "allow"
unseparated_literal_suffix = "allow"
used_underscore_binding = "allow"
unwrap_in_result = "allow"
unwrap_used = "allow"
wildcard_enum_match_arm = "allow"
