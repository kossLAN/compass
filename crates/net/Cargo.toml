[package]
name = "compass-net"
description = "Linux kernel and userspace WireGuard, routing, nftables, iptables and resolvconf integration for compass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
compass-proto.workspace = true

arc-swap.workspace = true
boringtun.workspace = true
etherparse.workspace = true
ipnet.workspace = true
nix.workspace = true
prefix-trie.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tun-rs.workspace = true

futures-util = { workspace = true, optional = true }
genetlink = { workspace = true, optional = true }
netlink-packet-core = { workspace = true, optional = true }
netlink-packet-generic = { workspace = true, optional = true }
netlink-packet-wireguard = { workspace = true, optional = true }
rtnetlink = { workspace = true, optional = true }

[features]
linux = [
  "dep:futures-util",
  "dep:genetlink",
  "dep:netlink-packet-core",
  "dep:netlink-packet-generic",
  "dep:netlink-packet-wireguard",
  "dep:rtnetlink",
]
