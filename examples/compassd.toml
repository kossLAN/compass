# compassd can run a client, a lighthouse, or both. Keep the sections this machine needs and
# delete the rest. Nothing is stored on disk, so this file is the whole setup. Send SIGHUP to
# reload it.

# The socket `compass status` and the other CLI commands talk to.
[socket]
path = "/run/compass/compass.sock"
# Members of this group can use the CLI without root.
group = "wheel"

# ── Client ──────────────────────────────────────────────────────────────────────────────────

[client]
# This machine's WireGuard key. Make one with `compass genkey`, then give its public key
# (`compass pubkey < file`) to whoever runs the lighthouse.
private_key_file = "/run/secrets/compass-node.key"
# The name other nodes know this machine by. Leave it out to use the system hostname.
hostname = "laptop"

# A lighthouse is set up like a WireGuard peer: where to reach it, and its hub's public key.
# Every lighthouse you list belongs to the same mesh unless you give it a `mesh` name, so
# listing two is how you get a spare.
[[client.lighthouses]]
endpoint = "lh1.example.com:51820"
public_key = "QBOaPq4VcC/weEXCD8j3gJDzP2bmCb79WUVcllxn0hk="

# The dns and exit_node settings apply to the whole mesh, not just this lighthouse. You can
# repeat them on other lighthouses of the same mesh as long as they agree.
[client.lighthouses.dns]
# Resolve the mesh's names on this machine. compassd runs a small resolver for them and
# registers it with resolvconf. On by default.
accept = true

# Records this node adds to the mesh. A plain name goes under the mesh domain, so this one is
# grafana.laptop.mesh.internal. The lighthouse's acl decides which names a node may take.
[[client.lighthouses.dns.records]]
name = "grafana.laptop"
type = "CNAME"
value = "laptop"

[[client.lighthouses.dns.records]]
name = "nas.alice"
type = "A"
value = "192.168.1.20"

# With `zone`, the record goes in one of the lighthouse's extra zones instead. This one is
# printer.home.arpa. Use `name = "@"` for the zone itself.
[[client.lighthouses.dns.records]]
zone = "home.arpa"
name = "printer"
type = "A"
value = "192.168.1.30"

[client.lighthouses.exit_node]
# Send this machine's internet traffic through another node, over a direct path or a relay.
# While that node can't be reached, the traffic is blocked rather than sent out the normal
# way. Only one mesh can have an exit node, and `compass exit-node` overrides this until the
# next restart or reload.
peer = "web"
# Let other nodes use this machine as their exit node. The lighthouse also has to list it
# with `exit_node = true`.
advertise = false

# A second lighthouse for the same mesh. It gets the records and settings given for lh1.
[[client.lighthouses]]
endpoint = "lh2.example.com:51820"
public_key = "ZemVXzGDbiOIPQd8+KvX5kuWH8FY32UK8V3UKBsV0g8="

# A different mesh, because it has its own `mesh` name. If two meshes serve the same domain or
# zone, the one listed first wins.
[[client.lighthouses]]
endpoint = "lh.work.example:51820"
public_key = "HwT2lNrnPcBbmfjA5NUgbP5uh5X4Sz5R+DGsJT6AYRc="
mesh = "work"
dns = { accept = false }

[client.interface]
# One WireGuard interface carries everything: the lighthouses and every peer, direct or relayed.
name = "bh0"
listen_port = 51821
# Interfaces whose addresses are never offered to peers as a way to reach this machine. A
# trailing `*` matches anything.
exclude = ["docker*", "br-*", "veth*", "virbr*"]

# ── Lighthouse ──────────────────────────────────────────────────────────────────────────────
# Every lighthouse of a mesh runs this same section. Only the hub's key differs.

[lighthouse.network]
# Nodes find each other as <hostname>.mesh.internal.
domain = "mesh.internal"
# Extra zones that nodes can publish records in, if the acl lets them. A name nobody has
# published still resolves the normal way, so a zone can sit on top of a real domain, and it
# can be the parent of the mesh domain. Zones can change on reload. The rest of this section
# needs a restart.
zones = ["home.arpa"]
# Every node gets one address from each range, so both are required.
ipv4 = "100.64.0.0/10"
ipv6 = "fd26:d40f:838e::/48"

[lighthouse.hub]
# The lighthouse's own WireGuard interface. Nodes connect to it to talk to the lighthouse, and
# only the keys listed under `nodes` get in.
interface = "compass-hub"
# UDP. Nodes also ask this port what their public address is.
listen_port = 51820
# Make one with `compass genkey`. Clients need its public key (`compass pubkey < file`).
private_key_file = "/run/secrets/compass-hub.key"

# The machines in the mesh. One whose key is not listed gets no answer at all, and deleting an
# entry removes that machine on the next reload. The name is only a label. `owner` and `tags`
# are what the acl below goes by.
[lighthouse.nodes.laptop]
public_key = "0D5zlRK6XORev2ICQb4hDebYYTP8edb4T0dPGDifChE="
owner = "alice"
tags = ["tag:laptop"]

[lighthouse.nodes.runner]
public_key = "83BaEg3M6qOBBNn1+5A9aegDGREMbz0ZClKEyNCS2Vw="
tags = ["tag:ci"]

[lighthouse.nodes.web]
public_key = "jIneXXAKF+muwHfPDdYBKpy+8ABOzudJKsPsSAqGsE8="
tags = ["tag:web"]
# This machine may be used as an exit node, if it offers to be one.
exit_node = true

[lighthouse.groups]
admins = ["alice"]

# Nothing is allowed until a rule says so. A rule lets `src` open connections to `dst`, and
# replies always get back. `dns` lets `src` publish those names. They are under the mesh
# domain unless they end in a dot, and "*.{hostname}" means anything below the node's own
# hostname.
[[lighthouse.acl]]
src = ["group:admins"]
dst = ["*"]

[[lighthouse.acl]]
src = ["tag:laptop", "tag:ci"]
dst = ["tag:web"]
proto = "tcp"
ports = [80, 443]

[[lighthouse.acl]]
src = ["*"]
dst = ["*"]
proto = "icmp"

# Admins can use any exit node they can reach.
[[lighthouse.acl]]
src = ["group:admins"]
dst = ["autogroup:internet"]

# Every node can publish names below its own hostname, like grafana.laptop.
[[lighthouse.acl]]
src = ["*"]
dns = ["*.{hostname}"]

# Alice's machines can also take names under alice, and anything in the home.arpa zone.
[[lighthouse.acl]]
src = ["alice"]
dns = ["*.alice", "*.home.arpa."]

[[lighthouse.acl]]
src = ["tag:web"]
dns = ["status"]
