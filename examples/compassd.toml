# compassd runs a client, a lighthouse, or both: keep the sections this node needs. Neither
# keeps state; everything is declared here. Reload with SIGHUP.

# Where `compass status` and other control clients reach the daemon.
[socket]
path = "/run/compass/compass.sock"
# Members may use the CLI without root.
group = "wheel"

# ── Client ──────────────────────────────────────────────────────────────────────────────────

[client]
# Presented every time the daemon starts. Create one with `compass authkey`.
auth_key_file = "/run/secrets/compass-laptops"
# Defaults to the system hostname.
hostname = "laptop"
# Only needed when the lighthouses' certificate is not from a public CA.
# ca_file = "/etc/compass/ca.pem"
# The node's WireGuard key, its identity; create it with `compass genkey`. Without it the node
# gets a new key on every start, registers as a new node and logs out when it stops, so give
# such nodes a pre-auth key with a short offline_ttl.
private_key_file = "/run/secrets/compass-node.key"

# The node registers with every lighthouse. Lighthouses that share an auth key serve one mesh:
# if one goes down, the others keep coordinating and relaying. Settings below apply to the
# lighthouse's whole mesh; lighthouses of one mesh may each set them but must not disagree.
# Without settings, a plain list works too:
# lighthouses = ["https://lh1.example.com:8443", "https://lh2.example.com:8443"]
[[client.lighthouses]]
url = "https://lh1.example.com:8443"

[client.lighthouses.dns]
# Resolve this mesh's names through a stub registered with resolvconf.
accept = true

# Records this node publishes in the lighthouse's mesh, as <name>.mesh.internal. The
# lighthouse's acl decides which names it may claim (here alice's nodes may claim names
# below their hostname, *.alice and *.home.arpa.).
[[client.lighthouses.dns.records]]
name = "grafana.laptop"
type = "CNAME"
value = "laptop"

[[client.lighthouses.dns.records]]
name = "nas.alice"
type = "A"
value = "192.168.1.20"

# With `zone`, the record goes into one of the lighthouse's zones as <name>.<zone> instead, and
# `name = "@"` is the zone itself.
[[client.lighthouses.dns.records]]
zone = "home.arpa"
name = "printer"
type = "A"
value = "192.168.1.30"

[client.lighthouses.exit_node]
# Send internet traffic through this peer of the mesh while a direct path to it is up; without
# one the traffic is blocked rather than sent out unprotected. Only one mesh can set it.
# `compass exit-node` overrides this until the daemon restarts or reloads.
peer = "web"
# Offer this node as an exit node in the mesh; its pre-auth key needs `exit_node = true`.
advertise = false

# The same mesh as lh1, so it publishes lh1's records and uses lh1's settings too.
[[client.lighthouses]]
url = "https://lh2.example.com:8443"

# Another mesh, with its own key and settings. When two meshes answer for the same zone or
# domain, this node keeps the one whose lighthouse is listed first.
[[client.lighthouses]]
url = "https://lh.work.example:8443"
auth_key_file = "/run/secrets/compass-work"
dns = { accept = false }

[client.interface]
# The node's only WireGuard interface, for direct and relayed peers alike.
name = "bh0"
listen_port = 51821
# Addresses of these interfaces are never offered to peers; a trailing `*` matches any suffix.
exclude = ["docker*", "br-*", "veth*", "virbr*"]

# ── Lighthouse ──────────────────────────────────────────────────────────────────────────────
# Every lighthouse of a mesh runs the same section, apart from the hub's endpoint and key.

[lighthouse.api]
listen = "[::]:8443"
# Omit both when a reverse proxy terminates TLS.
tls_cert_file = "/var/lib/acme/lh1.example.com/fullchain.pem"
tls_key_file = "/var/lib/acme/lh1.example.com/key.pem"

[lighthouse.network]
# Peers resolve each other as <hostname>.mesh.internal.
domain = "mesh.internal"
# More zones the mesh answers for. Nodes publish records in them as the acl allows, and
# clients answer every other name in them with NXDOMAIN. Unlike the rest of this section, zones
# can change on reload.
zones = ["home.arpa"]
# Both are required: every node gets one address from each.
ipv4 = "100.64.0.0/10"
ipv6 = "fd7a:115c:a1e0::/48"

[lighthouse.hub]
# Answers STUN, so nodes learn their public address. Relayed traffic goes through the API.
listen_port = 51820
# How nodes reach this port.
endpoint = "lh1.example.com:51820"

[lighthouse.nodes]
# Every node is removed once it has been offline this long; a key can override it.
offline_ttl = "30d"
# Public keys (shown by `compass status`) that may never register again.
revoked = []

# Pre-auth keys. Create a secret with `compass authkey` and point `secret_file` at it. Clients
# log in with the same secret.
[lighthouse.keys.laptops]
secret_file = "/run/secrets/compass-laptops"
owner = "alice"
tags = ["tag:laptop"]

[lighthouse.keys.ci]
secret_file = "/run/secrets/compass-ci"
tags = ["tag:ci"]
# Runners without key files are new nodes each run; clean up the ones that crash quickly.
offline_ttl = "10m"

[lighthouse.keys.servers]
secret_file = "/run/secrets/compass-servers"
tags = ["tag:web"]
# Nodes with this key may offer themselves as exit nodes.
exit_node = true

[lighthouse.groups]
admins = ["alice"]

# Default deny. Each rule lets `src` reach `dst`, with replies always allowed, and publish
# records for the names in `dns`. Names are under the mesh domain unless they end in a dot, and
# "*.{hostname}" is everything below the node's own hostname.
[[lighthouse.acl]]
src = ["group:admins"]
dst = ["*"]

[[lighthouse.acl]]
src = ["tag:laptop", "tag:ci"]
dst = ["tag:web"]
proto = "tcp"
ports = [80, 443]

[[lighthouse.acl]]
src = ["*"]
dst = ["*"]
proto = "icmp"

# Admins may send their internet traffic through any exit node they can reach.
[[lighthouse.acl]]
src = ["group:admins"]
dst = ["autogroup:internet"]

# Every node may publish records below its hostname, like grafana.laptop.
[[lighthouse.acl]]
src = ["*"]
dns = ["*.{hostname}"]

[[lighthouse.acl]]
src = ["alice"]
dns = ["*.alice", "*.home.arpa."]

[[lighthouse.acl]]
src = ["tag:web"]
dns = ["status"]
